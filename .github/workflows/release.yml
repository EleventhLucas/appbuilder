name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package_version: ${{ steps.version.outputs.package_version }}
      build_version: ${{ steps.version.outputs.build_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          TZ: America/New_York
        run: |
          git fetch --tags --force
          date_version="$(date +'%Y.%-m.%-d')"
          prefix="v${date_version}."
          sequence="$(git tag -l "${prefix}*" | awk -v prefix="$prefix" 'index($0, prefix) == 1 { suffix = substr($0, length(prefix) + 1); if (suffix ~ /^[0-9]+$/ && suffix > maximum) maximum = suffix } END { print maximum + 1 }')"
          tag="${prefix}${sequence}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "package_version=${date_version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${date_version}.${sequence}" >> "$GITHUB_OUTPUT"

  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package_script: package:win
          - os: ubuntu-latest
            package_script: package:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepare:codex
      - name: Set release package version
        env:
          APPBUILDER_RELEASE_VERSION: ${{ needs.version.outputs.package_version }}
        run: |
          node -e "const fs=require('node:fs');const path='package.json';const pkg=JSON.parse(fs.readFileSync(path,'utf8'));pkg.version=process.env.APPBUILDER_RELEASE_VERSION;fs.writeFileSync(path,JSON.stringify(pkg,null,2)+String.fromCharCode(10));"
      - if: runner.os == 'Windows'
        run: npm run test:e2e
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
      - run: npm run ${{ matrix.package_script }} -- --publish never --config.buildVersion=${{ needs.version.outputs.build_version }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - if: runner.os == 'Windows'
        run: |
          $env:APPBUILDER_E2E_EXECUTABLE = (Resolve-Path "release/win-unpacked/AppBuilder.exe")
          npx playwright test
      - if: runner.os == 'Linux'
        run: APPBUILDER_E2E_EXECUTABLE="$PWD/release/linux-unpacked/appbuilder" xvfb-run -a npx playwright test
      - run: node scripts/generate-checksums.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: appbuilder-${{ runner.os }}
          path: |
            release/*
            !release/*-unpacked/**

  publish:
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AppBuilder ${{ needs.version.outputs.build_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            Windows artifacts are currently unsigned. Windows may display a SmartScreen warning.
            Verify the adjacent SHA-256 file before running a downloaded artifact.
          files: artifacts/*
